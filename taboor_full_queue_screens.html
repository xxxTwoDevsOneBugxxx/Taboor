<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معاينة صفحة طوابيري كاملة (Taboor Queue Screen Concepts)</title>
  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #DFD7CA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 800px;
    }
    h1 {
      color: #07333B;
      margin: 0 0 10px 0;
      font-size: 28px;
      font-weight: 800;
    }
    p {
      color: #556B6F;
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .preview-card {
      background: #EAE4D9;
      padding: 24px;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(7, 51, 59, 0.16);
      max-width: 1380px;
      width: 100%;
      box-sizing: border-box;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
    }
    .footer-actions {
      margin-top: 24px;
      display: flex;
      gap: 16px;
    }
    .badge {
      background: #0B4C56;
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>معاينة صفحة «طوابيري» كاملة في إطار هاتف حقيقي 📱</h1>
    <p>كل مقترح يعرض الشاشة كاملة: من الـ Dynamic Island والهيدر، لكرت التذكرة، وأزرار التحكم، وسجل الزيارات، وحتى الـ Navigation Dock السفلي.</p>
  </div>
  <div class="preview-card">
    <img src="taboor_full_queue_screens.png" alt="Taboor Full Screen Concepts">
  </div>
</body>
</html>
