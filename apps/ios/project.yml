name: Taboor
options:
  bundleIdPrefix: com.taboor
  deploymentTarget:
    iOS: "26.0"
targets:
  Taboor:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Taboor
    dependencies:
      - target: TaboorWidgets
    info:
      path: Taboor/Info.plist
      properties:
        CFBundleDisplayName: "Taboor"
        CFBundleDevelopmentRegion: "en"
        CFBundleLocalizations:
          - en
          - ar
        CFBundleIdentifier: com.taboor.ios
        CFBundleURLTypes:
          - CFBundleURLName: "com.taboor.ios"
            CFBundleURLSchemes:
              - "taboor"
        NSSupportsLiveActivities: YES
        NSSupportsLiveActivitiesFrequentUpdates: YES
        NSSiriUsageDescription: "استخدام سيري للاستعلام الصوتي عن دورك وتأجيل المواعيد صوتياً"
        NSLocationWhenInUseUsageDescription: "نحتاج إلى موقعك الجغرافي لعرض أقرب العيادات والخدمات إليك وحساب المسافة ووقت الوصول بدقة."
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - "Tajawal-Regular.ttf"
          - "Tajawal-Medium.ttf"
          - "Tajawal-Bold.ttf"
          - "Tajawal-ExtraBold.ttf"
          - "Inter-Regular.ttf"
          - "Inter-Medium.ttf"
          - "Inter-SemiBold.ttf"
          - "Inter-Bold.ttf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taboor.ios
        DEVELOPMENT_TEAM: UFBWC7D67P
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"

  TaboorWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TaboorWidgets
      - path: Taboor/Core/LiveActivity/QueueActivityAttributes.swift
    info:
      path: TaboorWidgets/Info.plist
      properties:
        CFBundleDisplayName: "TaboorWidgets"
        CFBundleIdentifier: com.taboor.ios.TaboorWidgets
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taboor.ios.TaboorWidgets
        DEVELOPMENT_TEAM: UFBWC7D67P
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  Taboor:
    build:
      targets:
        Taboor: all
        TaboorWidgets: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
