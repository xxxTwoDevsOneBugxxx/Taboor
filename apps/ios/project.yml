name: Taboor
options:
  bundleIdPrefix: com.taboor
  deploymentTarget:
    iOS: "17.0"
targets:
  Taboor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Taboor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taboor.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_KEY_UIAppFonts:
          - "Tajawal-Regular.ttf"
          - "Tajawal-Medium.ttf"
          - "Tajawal-Bold.ttf"
          - "Tajawal-ExtraBold.ttf"
          - "Inter-Regular.ttf"
          - "Inter-Medium.ttf"
          - "Inter-SemiBold.ttf"
          - "Inter-Bold.ttf"
