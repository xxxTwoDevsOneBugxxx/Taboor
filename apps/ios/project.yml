name: Taboor
options:
  bundleIdPrefix: com.taboor
  deploymentTarget:
    iOS: "26.0"
targets:
  Taboor:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Taboor
    info:
      path: Taboor/Info.plist
      properties:
        CFBundleDisplayName: "Taboor"
        CFBundleDevelopmentRegion: "en"
        CFBundleLocalizations:
          - en
          - ar
        CFBundleIdentifier: com.taboor.ios
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
        UIAppFonts:
          - "Tajawal-Regular.ttf"
          - "Tajawal-Medium.ttf"
          - "Tajawal-Bold.ttf"
          - "Tajawal-ExtraBold.ttf"
          - "Inter-Regular.ttf"
          - "Inter-Medium.ttf"
          - "Inter-SemiBold.ttf"
          - "Inter-Bold.ttf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taboor.ios
        DEVELOPMENT_TEAM: UFBWC7D67P
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
schemes:
  Taboor:
    build:
      targets:
        Taboor: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
