<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" style="background:#F5F0E7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4C56" />
      <stop offset="100%" stop-color="#07333B" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#159F99" />
      <stop offset="100%" stop-color="#0B4C56" />
    </linearGradient>
    <linearGradient id="softTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2FAF7" />
      <stop offset="100%" stop-color="#E3F3EE" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6A253" />
      <stop offset="100%" stop-color="#E28935" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B4C56" flood-opacity="0.08" />
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Canvas Header -->
  <text x="600" y="50" font-size="24" font-weight="800" fill="#07333B" text-anchor="middle">مقترحات تصميم كرت التذكرة (طابوري) • Taboor Ticket Card</text>
  <text x="600" y="78" font-size="14" font-weight="500" fill="#6A8084" text-anchor="middle">اختر التصميم الأنسب لتجربة المستخدم والهوية البصرية</text>

  <!-- ==================== CONCEPT 1: LUXURY BENTO PASS ==================== -->
  <g transform="translate(40, 110)">
    <!-- Title Tag -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#0B4C56" />
    <text x="90" y="19" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">المقترح 1: Bento Pass العصري</text>

    <!-- Main Card Body -->
    <rect x="0" y="38" width="350" height="690" rx="28" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- Hospital Header Bar -->
    <g transform="translate(20, 58)">
      <rect x="0" y="0" width="46" height="46" rx="14" fill="url(#tealGrad)" />
      <path d="M19 13 h8 v8 h8 v8 h-8 v8 h-8 v-8 h-8 v-8 h8 z" fill="#FFFFFF" />
      
      <!-- Hospital Text -->
      <text x="58" y="20" font-size="15" font-weight="800" fill="#07333B">مستشفى دار الفؤاد</text>
      <text x="58" y="38" font-size="12" font-weight="500" fill="#6A8084">عيادات الباطنة والقلب • د. شاكر</text>
    </g>

    <!-- Bento 1: Ticket Hero Box -->
    <g transform="translate(20, 124)">
      <rect x="0" y="0" width="310" height="110" rx="20" fill="url(#softTealGrad)" stroke="#159F99" stroke-opacity="0.25" stroke-width="1.2" />
      <text x="20" y="32" font-size="11" font-weight="700" fill="#159F99" letter-spacing="1">رقم تذكرتك الحالية</text>
      <text x="20" y="80" font-size="42" font-weight="900" fill="#07333B" font-family="system-ui">#A-12</text>
      
      <!-- Current Serving Tag inside Hero -->
      <g transform="translate(190, 24)">
        <rect x="0" y="0" width="100" height="62" rx="14" fill="#FFFFFF" stroke="#E2ECE8" stroke-width="1" filter="url(#badgeShadow)" />
        <text x="50" y="22" font-size="10" font-weight="600" fill="#88989A" text-anchor="middle">الدور الحالي</text>
        <text x="50" y="48" font-size="20" font-weight="900" fill="#0B4C56" text-anchor="middle">A-10</text>
      </g>
    </g>

    <!-- Bento 2: Dual Metric Tiles -->
    <g transform="translate(20, 250)">
      <!-- Left Tile: Ahead -->
      <rect x="0" y="0" width="148" height="85" rx="18" fill="#FDF8F2" stroke="#F6A253" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="28" cy="28" r="14" fill="#F6A253" fill-opacity="0.15" />
      <text x="28" y="33" font-size="12" text-anchor="middle" fill="#F6A253">👥</text>
      <text x="50" y="32" font-size="11" font-weight="600" fill="#88989A">أمامك في الطابور</text>
      <text x="20" y="68" font-size="24" font-weight="900" fill="#F6A253">2 <tspan font-size="13" font-weight="700" fill="#B36E28">أشخاص</tspan></text>

      <!-- Right Tile: Est Time -->
      <rect x="162" y="0" width="148" height="85" rx="18" fill="#F2FAF8" stroke="#159F99" stroke-opacity="0.25" stroke-width="1.2" />
      <circle cx="190" cy="28" r="14" fill="#159F99" fill-opacity="0.15" />
      <text x="190" y="33" font-size="12" text-anchor="middle" fill="#159F99">⏱️</text>
      <text x="212" y="32" font-size="11" font-weight="600" fill="#88989A">الوقت المتوقع</text>
      <text x="182" y="68" font-size="24" font-weight="900" fill="#159F99">~8 <tspan font-size="13" font-weight="700" fill="#0B4C56">دقائق</tspan></text>
    </g>

    <!-- Bento 3: Live Progress Timeline -->
    <g transform="translate(20, 355)">
      <rect x="0" y="0" width="310" height="72" rx="16" fill="#FBF9F5" stroke="#EBE5DB" stroke-width="1" />
      <!-- Progress Bar -->
      <rect x="16" y="20" width="278" height="8" rx="4" fill="#E3F3EE" />
      <rect x="16" y="20" width="208" height="8" rx="4" fill="url(#tealGrad)" />
      
      <text x="16" y="52" font-size="11.5" font-weight="600" fill="#07333B">🖥️ شباك الخدمة: رقم 3</text>
      <text x="294" y="52" font-size="12" font-weight="800" fill="#159F99" text-anchor="end">75%</text>
    </g>

    <!-- Bento 4: Location & Live Navigation Strip -->
    <g transform="translate(20, 445)">
      <rect x="0" y="0" width="310" height="64" rx="16" fill="#FBF9F5" stroke="#EBE5DB" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="#E3F3EE" />
      <text x="32" y="37" font-size="14" text-anchor="middle">📍</text>
      <text x="58" y="28" font-size="11.5" font-weight="700" fill="#07333B">تبعد 850 متر عن موقعك</text>
      <text x="58" y="46" font-size="10.5" font-weight="500" fill="#88989A">حوالي 5 دقائق بالسيارة</text>
      
      <!-- Mini CTA -->
      <rect x="226" y="18" width="70" height="28" rx="14" fill="#E3F3EE" />
      <text x="261" y="36" font-size="11" font-weight="700" fill="#159F99" text-anchor="middle">الخريطة</text>
    </g>

    <!-- Action Buttons Inside Card -->
    <g transform="translate(20, 525)">
      <rect x="0" y="0" width="148" height="44" rx="14" fill="#F7F5F0" stroke="#E2DCD2" stroke-width="1" />
      <text x="74" y="27" font-size="12" font-weight="700" fill="#07333B" text-anchor="middle">⏳ تأجيل (15 د)</text>

      <rect x="162" y="0" width="148" height="44" rx="14" fill="#FFF5F5" stroke="#FBD5D5" stroke-width="1" />
      <text x="236" y="27" font-size="12" font-weight="700" fill="#D32F2F" text-anchor="middle">✕ إلغاء الدور</text>
    </g>

    <!-- Full Tracking Button -->
    <g transform="translate(20, 582)">
      <rect x="0" y="0" width="310" height="48" rx="16" fill="url(#inkGrad)" />
      <text x="155" y="30" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">🗺️ تتبع المسار المباشر للطابور</text>
    </g>
  </g>

  <!-- ==================== CONCEPT 2: WALLET PASS (AIRLINE / TRANSIT ELEGANCE) ==================== -->
  <g transform="translate(425, 110)">
    <!-- Title Tag -->
    <rect x="0" y="0" width="195" height="28" rx="14" fill="#159F99" />
    <text x="97" y="19" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">المقترح 2: Apple Wallet الفخم</text>

    <!-- Main Card Body with Dark Ink Hero Header -->
    <rect x="0" y="38" width="350" height="690" rx="28" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- Top Solid Brand Block -->
    <path d="M0 66 A28 28 0 0 1 28 38 L322 38 A28 28 0 0 1 350 66 L350 145 L0 145 Z" fill="url(#inkGrad)" />
    
    <g transform="translate(24, 60)">
      <text x="0" y="22" font-size="17" font-weight="900" fill="#FFFFFF">مستشفى دار الفؤاد</text>
      <text x="0" y="42" font-size="12" font-weight="500" fill="#A4C2C7">عيادات الباطنة • د. أحمد شاكر</text>
      
      <!-- Verified Seal -->
      <circle cx="280" cy="24" r="16" fill="#159F99" fill-opacity="0.3" />
      <text x="280" y="30" font-size="14" text-anchor="middle" fill="#FFFFFF">✓</text>
    </g>

    <!-- Circular Queue Gauge in Card Center -->
    <g transform="translate(175, 235)">
      <!-- Outer Track -->
      <circle cx="0" cy="0" r="68" fill="none" stroke="#E3F3EE" stroke-width="10" />
      <!-- Arc Progress -->
      <circle cx="0" cy="0" r="68" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-dasharray="320" stroke-dashoffset="80" stroke-linecap="round" />
      
      <!-- Center Number -->
      <text x="0" y="-12" font-size="11" font-weight="700" fill="#88989A" text-anchor="middle">تذكرتك</text>
      <text x="0" y="22" font-size="34" font-weight="900" fill="#07333B" font-family="system-ui" text-anchor="middle">#A-12</text>
      <text x="0" y="42" font-size="11" font-weight="700" fill="#159F99" text-anchor="middle">شباك 3</text>
    </g>

    <!-- Three Horizontal Data Columns -->
    <g transform="translate(25, 335)">
      <rect x="0" y="0" width="300" height="74" rx="18" fill="#F7F5F0" />
      
      <!-- Col 1 -->
      <text x="50" y="26" font-size="10.5" font-weight="600" fill="#88989A" text-anchor="middle">الدور الحالي</text>
      <text x="50" y="54" font-size="19" font-weight="900" fill="#07333B" text-anchor="middle">A-10</text>
      <line x1="100" y1="18" x2="100" y2="56" stroke="#E0DAD0" stroke-width="1" />

      <!-- Col 2 -->
      <text x="150" y="26" font-size="10.5" font-weight="600" fill="#88989A" text-anchor="middle">أمامك</text>
      <text x="150" y="54" font-size="19" font-weight="900" fill="#F6A253" text-anchor="middle">2 أشخاص</text>
      <line x1="200" y1="18" x2="200" y2="56" stroke="#E0DAD0" stroke-width="1" />

      <!-- Col 3 -->
      <text x="250" y="26" font-size="10.5" font-weight="600" fill="#88989A" text-anchor="middle">الانتظار</text>
      <text x="250" y="54" font-size="19" font-weight="900" fill="#159F99" text-anchor="middle">~8 دقائق</text>
    </g>

    <!-- Barcode / Live NFC Strip Visual -->
    <g transform="translate(30, 435)">
      <rect x="0" y="0" width="290" height="70" rx="14" fill="#FFFFFF" stroke="#EBE5DB" stroke-width="1" />
      <!-- Stylized barcode bars -->
      <g transform="translate(20, 16)" fill="#07333B">
        <rect x="0" y="0" width="3" height="38" />
        <rect x="6" y="0" width="5" height="38" />
        <rect x="15" y="0" width="2" height="38" />
        <rect x="20" y="0" width="6" height="38" />
        <rect x="30" y="0" width="3" height="38" />
        <rect x="36" y="0" width="8" height="38" />
        <rect x="48" y="0" width="2" height="38" />
        <rect x="54" y="0" width="5" height="38" />
        <rect x="63" y="0" width="3" height="38" />
        <rect x="70" y="0" width="7" height="38" />
        <rect x="82" y="0" width="2" height="38" />
        <rect x="88" y="0" width="4" height="38" />
        <rect x="96" y="0" width="6" height="38" />
        <rect x="106" y="0" width="3" height="38" />
        <rect x="112" y="0" width="8" height="38" />
        <rect x="124" y="0" width="2" height="38" />
        <rect x="130" y="0" width="5" height="38" />
        <rect x="140" y="0" width="4" height="38" />
        <rect x="148" y="0" width="6" height="38" />
        <rect x="158" y="0" width="3" height="38" />
        <rect x="165" y="0" width="7" height="38" />
        <rect x="176" y="0" width="2" height="38" />
        <rect x="182" y="0" width="5" height="38" />
        <rect x="190" y="0" width="3" height="38" />
        <rect x="197" y="0" width="8" height="38" />
        <rect x="210" y="0" width="2" height="38" />
        <rect x="216" y="0" width="5" height="38" />
        <rect x="225" y="0" width="6" height="38" />
        <rect x="235" y="0" width="3" height="38" />
        <rect x="242" y="0" width="6" height="38" />
      </g>
    </g>

    <!-- Location Footer -->
    <g transform="translate(25, 525)">
      <text x="150" y="20" font-size="12" font-weight="600" fill="#6A8084" text-anchor="middle">📍 مدينة نصر • شارع النصر (تبعد 850م)</text>
    </g>

    <!-- Dual Actions -->
    <g transform="translate(25, 565)">
      <rect x="0" y="0" width="144" height="46" rx="14" fill="#F7F5F0" />
      <text x="72" y="28" font-size="12" font-weight="700" fill="#07333B" text-anchor="middle">تأجيل الدور</text>

      <rect x="156" y="0" width="144" height="46" rx="14" fill="url(#inkGrad)" />
      <text x="228" y="28" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">فتح الخريطة</text>
    </g>
  </g>

  <!-- ==================== CONCEPT 3: MINIMAL STREAMLINE ==================== -->
  <g transform="translate(810, 110)">
    <!-- Title Tag -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#07333B" />
    <text x="90" y="19" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">المقترح 3: Streamline فائق البساطة</text>

    <!-- Main Card Body -->
    <rect x="0" y="38" width="350" height="690" rx="28" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- Hospital Header Full Width -->
    <g transform="translate(24, 66)">
      <text x="0" y="24" font-size="19" font-weight="900" fill="#07333B">مستشفى دار الفؤاد</text>
      <text x="0" y="46" font-size="13" font-weight="500" fill="#6A8084">العيادات الخارجية • عيادة الباطنة والقلب</text>
      <line x1="0" y1="62" x2="302" y2="62" stroke="#EBE5DB" stroke-width="1" />
    </g>

    <!-- Big Center Split: Number on Left, Countdown on Right -->
    <g transform="translate(24, 155)">
      <!-- Number Side -->
      <text x="0" y="20" font-size="11" font-weight="700" fill="#159F99">رقمك</text>
      <text x="0" y="68" font-size="46" font-weight="900" fill="#07333B" font-family="system-ui">#A-12</text>

      <!-- Now Serving Pill -->
      <g transform="translate(170, 15)">
        <rect x="0" y="0" width="132" height="60" rx="16" fill="#F2FAF8" stroke="#159F99" stroke-opacity="0.3" stroke-width="1" />
        <text x="66" y="22" font-size="10.5" font-weight="700" fill="#159F99" text-anchor="middle">يُنادى الآن</text>
        <text x="66" y="48" font-size="22" font-weight="900" fill="#07333B" text-anchor="middle">A-10</text>
      </g>
    </g>

    <!-- Clean Two Metric Cards -->
    <g transform="translate(24, 255)">
      <rect x="0" y="0" width="302" height="88" rx="18" fill="#FDFBF7" stroke="#ECE6DC" stroke-width="1" />
      
      <!-- Metric Left -->
      <g transform="translate(30, 24)">
        <text x="0" y="14" font-size="11" font-weight="600" fill="#88989A">المتبقين قبلك</text>
        <text x="0" y="44" font-size="24" font-weight="900" fill="#F6A253">2 <tspan font-size="12" font-weight="600" fill="#B36E28">أشخاص في الطابور</tspan></text>
      </g>
      
      <!-- Metric Right -->
      <g transform="translate(190, 24)">
        <text x="0" y="14" font-size="11" font-weight="600" fill="#88989A">الوقت المتبقي</text>
        <text x="0" y="44" font-size="24" font-weight="900" fill="#159F99">~8 <tspan font-size="12" font-weight="600" fill="#0B4C56">دقيقة</tspan></text>
      </g>
    </g>

    <!-- Simple Progress -->
    <g transform="translate(24, 370)">
      <rect x="0" y="0" width="302" height="56" rx="14" fill="#F7F5F0" />
      <rect x="14" y="16" width="274" height="6" rx="3" fill="#E3F3EE" />
      <rect x="14" y="16" width="205" height="6" rx="3" fill="#159F99" />
      <text x="14" y="42" font-size="11" font-weight="600" fill="#6A8084">الخدمة تقدم على شباك رقم 3</text>
      <text x="288" y="42" font-size="11.5" font-weight="800" fill="#159F99" text-anchor="end">75%</text>
    </g>

    <!-- Location & Distance -->
    <g transform="translate(24, 450)">
      <rect x="0" y="0" width="302" height="60" rx="14" fill="#FFFFFF" stroke="#ECE6DC" stroke-width="1" />
      <text x="18" y="26" font-size="12" font-weight="700" fill="#07333B">فرع مدينة نصر • 850 متر</text>
      <text x="18" y="46" font-size="11" font-weight="500" fill="#88989A">حوالي 5 دقائق بالسيارة حتى الوصول</text>
    </g>

    <!-- Clean Actions -->
    <g transform="translate(24, 535)">
      <rect x="0" y="0" width="302" height="46" rx="14" fill="url(#inkGrad)" />
      <text x="151" y="28" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">تتبع المسار المباشر للخريطة</text>

      <rect x="0" y="56" width="144" height="42" rx="12" fill="#F7F5F0" />
      <text x="72" y="82" font-size="11.5" font-weight="700" fill="#07333B" text-anchor="middle">تأجيل (15 د)</text>

      <rect x="158" y="56" width="144" height="42" rx="12" fill="#FFF5F5" />
      <text x="230" y="82" font-size="11.5" font-weight="700" fill="#D32F2F" text-anchor="middle">إلغاء التذكرة</text>
    </g>
  </g>
</svg>