<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقترحات كرت تذكرة طابور (Taboor Ticket Cards)</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #EFE9DE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      color: #07333B;
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 800;
    }
    p {
      color: #6A8084;
      margin: 0;
      font-size: 16px;
    }
    .container {
      background: #F5F0E7;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(11, 76, 86, 0.12);
      max-width: 1240px;
      width: 100%;
      overflow-x: auto;
    }
    img, svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>مقترحات تصميم كرت تذكرة طابوري</h1>
    <p>اختر التصميم الأنسب (المقترح 1 أو 2 أو 3) لتطبيقه مباشرة في التطبيق</p>
  </div>
  <div class="container">
    <img src="ticket_card_concepts.png" alt="Taboor Ticket Cards">
  </div>
</body>
</html>
